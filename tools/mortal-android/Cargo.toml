[package]
name = "mortal_android"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
ahash = "0.8"
anyhow = "1"
boomphf = "0.6"
byteorder = "1"
derivative = "2"
derive_more = { version = "2", features = ["add", "add_assign", "sum"] }
flate2 = "1"
jni = "=0.21.1"
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
tinyvec = { version = "1", features = ["alloc", "serde"] }

[features]
sp_reproduce_cpp_ver = []

[profile.release]
lto = "thin"
strip = "debuginfo"
